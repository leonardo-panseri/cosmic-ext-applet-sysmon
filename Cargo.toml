[workspace]
# The applet is the root package. The probe and its protocol join as `crates/*` (plan §3.1).
members = [".", "crates/*"]
resolver = "3"

[package]
name = "cosmic-ext-applet-sysmon"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "System monitor applet for the COSMIC™ desktop"
repository = "https://github.com/leonardo-panseri/cosmic-ext-applet-sysmon.git"

[build-dependencies]
xdgen = "0.1"

[dependencies]
i18n-embed-fl = "0.10"
rust-embed = "8.11"
# Already in the tree through libcosmic; for the settings stored with cosmic-config (§2.3).
serde = { version = "1.0", features = ["derive"] }
# Already in the tree (through `cc`); splits a process monitor command line into words (D5).
shlex = "2"
# The probe's protocol, and its logic for the in-process backend outside a Flatpak (§3.2).
sysmon-probe = { path = "crates/sysmon-probe" }
sysmon-proto = { path = "crates/sysmon-proto" }
# Already in the tree through libcosmic, with the same features; for UPower `OnBattery` (D2).
zbus = { version = "6.3", default-features = false, features = ["proxy", "tokio"] }

[dev-dependencies]
# Already in the tree; a scratch config directory for the cosmic-config round trip.
tempfile = "3"
# Already in the tree through cosmic-config; checks how the panel button's rows are stored.
ron = "0.12"

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
# The same set as pop-os/cosmic-applets, minus the defaults. No `wgpu`: tiny-skia uses about half
# the memory (measured for cosmic-ext-applet-codexbar: 35 MB RSS against 71 MB). No `x11`: the
# panel is Wayland-only. No `a11y`: libcosmic routes an accessibility click only to `on_press`,
# never to the `on_press_down` the panel button uses.
default-features = false
features = [
    # Applet support
    "applet",
    "applet-token",
    # Uses cosmic-settings-daemon to watch for config file changes
    "dbus-config",
    # Support creating additional application windows.
    "multi-window",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Add Wayland support to winit
    "wayland",
    # Windowing support
    "winit",
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }

[package]
name = "sysmon-probe"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Host probe of the sysmon applet: process table, mounts and NVML, read-only"
publish = false

[dependencies]
sysmon-proto = { path = "../sysmon-proto" }
# Raw syscalls, no libc symbols: `statvfs` and the page size.
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "param"] }
# `dlopen` of the host's libnvidia-ml (ADR 0002, 0003); already in the tree through libcosmic.
libloading = "0.8"
